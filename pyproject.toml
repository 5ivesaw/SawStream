[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sawstream"
version = "2.0.0"
description = "Offline-first terminal media hub for YouTube, Music, Spotify links, Anime, and Movies/TV."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "5saw", email = "5ivesaw@users.noreply.github.com"}]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "yt-dlp>=2024.10.0",
    "pillow>=10.0.0",
]

[project.scripts]
sawstream = "sawstream.app:main"
